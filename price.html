<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SooBoo MySQL Client — 开通 Pro</title>
    <meta
      name="description"
      content="联系微信客服开通 SooBoo MySQL Client Pro，解锁数据传输、结构同步、数据同步与查询脚本云端备份能力。"
    />
    <style>
      :root {
        --primary: #00b96b;
        --navy: #102033;
        --navy-light: #17324f;
        --gold: #d89b22;
        --gold-light: #ffd666;
        --amber-text: #d48806;
        --text: #1a1f1c;
        --text-secondary: #5c6b62;
        --text-faint: #8a968f;
        --border: #d8e0e7;
        --bg-soft: #f4f8fb;
        --font: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        font-family: var(--font);
        color: var(--text);
        background: #fff;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .page {
        padding: 8px;
      }

      /* 顶部横幅 */
      .banner {
        border-radius: 4px;
        padding: 12px;
        background: linear-gradient(
          145deg,
          #fff8e5 0%,
          #ffffff 50%,
          #f2fbf6 100%
        );
        border: 1px solid #f1dfaa;
      }
      .banner-head {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .banner-tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 1px 8px;
        border-radius: 4px;
        font-size: 12px;
        line-height: 20px;
        color: #d48806;
        background: #fffbe6;
        border: 1px solid #ffe58f;
        white-space: nowrap;
      }
      .banner-title {
        font-size: 18px;
        font-weight: 600;
        color: var(--navy);
      }
      .banner-desc {
        margin-top: 8px;
        font-size: 14px;
        color: var(--text-secondary);
      }

      /* 主体两栏 */
      .main {
        display: grid;
        grid-template-columns: 230px 1fr;
        gap: 14px;
        margin-top: 10px;
      }

      /* 左侧二维码卡片 */
      .qr-card {
        border-radius: 4px;
        padding: 12px;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        text-align: center;
        align-self: start;
      }
      .qr-head {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-bottom: 8px;
        font-weight: 600;
      }
      .qr-head svg {
        width: 16px;
        height: 16px;
        fill: var(--primary);
      }
      .qr-img {
        display: block;
        width: 160px;
        height: 160px;
        margin: 0 auto;
        border-radius: 4px;
        background: #fff;
        border: 1px solid var(--border);
      }
      .qr-tip {
        display: block;
        margin-top: 6px;
        font-size: 12px;
        color: var(--text-secondary);
      }

      /* 底部限时活动通栏（横跨两列） */
      .summer-card {
        grid-column: 1 / -1;
        border-radius: 4px;
        padding: 12px 14px;
        background: linear-gradient(
          135deg,
          var(--navy) 0%,
          var(--navy-light) 100%
        );
        color: #fff;
        border: 1px solid var(--navy-light);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .summer-name {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.72);
      }
      .summer-price-row {
        display: flex;
        align-items: baseline;
        gap: 6px;
        margin-top: 4px;
      }
      .summer-price {
        color: var(--gold-light);
        font-size: 24px;
        font-weight: 700;
      }
      .summer-unit {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.78);
      }
      .summer-origin {
        margin-left: 4px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.48);
        text-decoration: line-through;
      }
      .recommend-tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 1px 8px;
        border-radius: 4px;
        font-size: 12px;
        line-height: 20px;
        color: #d48806;
        background: #fffbe6;
        border: 1px solid #ffe58f;
        white-space: nowrap;
      }
      .plan-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .plan-card-wide {
        grid-column: 1 / -1;
      }
      .plan-card {
        padding: 8px 12px;
        border-radius: 4px;
        background: #fff;
        border: 1px solid var(--border);
      }
      .plan-name {
        font-size: 14px;
        font-weight: 600;
      }
      .plan-desc {
        margin-top: 2px;
        font-size: 12px;
        color: var(--text-secondary);
      }
      .plan-price-row {
        display: flex;
        align-items: baseline;
        gap: 4px;
        margin-top: 4px;
      }
      .plan-price {
        color: var(--amber-text);
        font-size: 18px;
        font-weight: 700;
      }
      .plan-unit {
        font-size: 12px;
        color: var(--text-secondary);
      }

      /* 底部权益提示 */
      .benefit {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        margin-top: 10px;
        padding: 10px 12px;
        border-radius: 4px;
        background: #f6ffed;
        border: 1px solid #b7eb8f;
        font-size: 14px;
        line-height: 1.6;
      }
      .benefit svg {
        flex: none;
        width: 16px;
        height: 16px;
        margin-top: 3px;
        fill: #52c41a;
      }

      @media (max-width: 560px) {
        .main {
          grid-template-columns: 1fr;
        }
        .qr-card {
          justify-self: center;
          min-width: 230px;
        }
      }
    </style>
  </head>
  <body>

            </div>
            <img class="qr-img" src="assets/wechat-qr.png" alt="微信客服二维码" />
            <span class="qr-tip">添加好友请备注：PRO</span>
            <span class="qr-tip">（优先处理）</span>
        </div>

        <div class="plan-grid">
            <div class="plan-card">
              <div class="plan-name">月度版</div>
              <div class="plan-desc">灵活按月 · 随用随开</div>
              <div class="plan-price-row">
                <span class="plan-price">¥6.8</span

            </div>
            <div class="plan-card">
              <div class="plan-name">季度版</div>
              <div class="plan-desc">季度优选 · 省心之选</div>
              <div class="plan-price-row">
                <span class="plan-price">¥16.8</span

              </div>
            </div>
            <div class="plan-card">
              <div class="plan-name">年度版</div>
              <div class="plan-desc">一年畅享 · 超值之选</div>
              <div class="plan-price-row">
                <span class="plan-price">¥56.8</span

              </div>
            </div>
            <div class="plan-card">
              <div class="plan-name">三年版</div>
              <div class="plan-desc">长期陪伴 · 更划算</div>
              <div class="plan-price-row">
                <span class="plan-price">¥116.8</span
                ><span class="plan-unit">元 / 三年</span>
              </div>
            </div>
            <div class="plan-card plan-card-wide">
              <div class="plan-name">永久版</div>
              <div class="plan-desc">一次付费 · 终身使用</div>
              <div class="plan-price-row">
                <span class="plan-price">¥188.8</span
                ><span class="plan-unit">元 / 永久</span>
              </div>
            </div>
        </div>

        <div class="summer-card">
          <div>
            <div class="summer-name">限时活动 · 永久版</div>
            <div class="summer-price-row">
              <span class="summer-price">¥168.8</span>
              <span class="summer-unit">元</span>
              <span class="summer-origin">¥188.8</span>
            </div>
          </div>
          <span class="recommend-tag">
            <svg
              viewBox="0 0 1024 1024"
              width="12"
              height="12"
              aria-hidden="true"
            >
              <path
                d="M858.9 689L530.5 308.2c-9.4-10.9-27.5-10.9-37 0L165.1 689c-12.2 14.2-1.2 35 18.5 35h656.8c19.7 0 30.7-20.8 18.5-35z"
              />
            </svg>
            推荐
          </span>
        </div>
      </div>

      <div class="benefit">
        <svg viewBox="0 0 1024 1024" aria-hidden="true">
          <path
            d="M699 353h-46.9c-10.2 0-19.9 4.9-25.9 13.2L512 630.1 397.8 366.2c-6-8.3-15.7-13.2-25.9-13.2H325c-6.5 0-10.3 7.4-6.5 12.7l124.3 173.8H375c-4.4 0-8 3.6-8 8v27.2c0 4.4 3.6 8 8 8h103.9v29.7H375c-4.4 0-8 3.6-8 8v27.2c0 4.4 3.6 8 8 8h103.9V704c0 4.4 3.6 8 8 8h41.4c4.4 0 8-3.6 8-8v-50.5H649c4.4 0 8-3.6 8-8v-27.2c0-4.4-3.6-8-8-8H536.3v-29.7H649c4.4 0 8-3.6 8-8v-27.2c0-4.4-3.6-8-8-8h-67.9l124.4-173.8c3.8-5.3 0-12.7-6.5-12.7z"
          />
          <path
            d="M512 64C264.6 64 64 264.6 64 512s200.6 448 448 448 448-200.6 448-448S759.4 64 512 64z m0 820c-205.4 0-372-166.6-372-372s166.6-372 372-372 372 166.6 372 372-166.6 372-372 372z"
          />
        </svg>
        <span
          >开通后即可使用数据传输、结构同步、数据同步、脚本云端备份以及后续所有新增功能。</span
        >
      </div>
    </div>
  </body>
</html>
